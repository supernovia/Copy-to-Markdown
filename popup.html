<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy to Markdown</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-width: 240px;
      margin: 0;
      padding: 16px;
      background: #fff;
      color: #222;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
    }

    button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      color: #222;
      transition: background 0.15s;
    }

    button:hover {
      background: #e8e8e8;
    }

    button:active {
      background: #ddd;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
      color: #555;
    }

    #status.success {
      color: #2a7a2a;
    }

    #status.error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1>Copy to Markdown</h1>
  <button id="copy-btn">Copy page as Markdown</button>
  <div id="status"></div>
  <script src="turndown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
